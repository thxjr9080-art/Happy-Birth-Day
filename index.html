<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Surat Ulang Tahun 💌</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #ffb6d5, #ffd6e8);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: "Comic Sans MS", cursive;
}

.envelope {
  width: 280px;
  height: 180px;
  background: #ff5fa2;
  border-radius: 10px;
  position: relative;
  cursor: pointer;
}

.flap {
  width: 0;
  height: 0;
  border-left: 140px solid transparent;
  border-right: 140px solid transparent;
  border-bottom: 90px solid #ff3f8e;
  position: absolute;
  top: 0;
  left: 0;
  transition: transform 1s;
  transform-origin: top;
}

.letter {
  position: absolute;
  top: 20px;
  left: 15px;
  width: 250px;
  height: 140px;
  background: white;
  border-radius: 10px;
  padding: 15px;
  text-align: center;
  opacity: 0;
  transform: translateY(50px);
  transition: 1s;
}

.open .flap {
  transform: rotateX(180deg);
}

.open .letter {
  opacity: 1;
  transform: translateY(-30px);
}

.letter h2 {
  color: hotpink;
}

.letter p {
  color: #444;
}
</style>
</head>

<body>

<audio id="musik">
  <source src="ramein.mp3" type="audio/mpeg">
</audio>

<div class="envelope" onclick="buka()">
  <div class="flap"></div>
  <div class="letter">
    <h2>🎉 Happy Birthday 🎉</h2>
    <p>Semoga harimu penuh tawa 😄💖</p>
  </div>
</div>

<script>
function buka() {
  document.querySelector(".envelope").classList.add("open");
  document.getElementById("musik").play();
}
</script>

</body>
</html>
